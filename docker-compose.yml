services:
  postgres:
    image: postgres:16-alpine
    container_name: rfleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rfleet}
      POSTGRES_USER: ${POSTGRES_USER:-rfleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rfleet123}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - rfleet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfleet -d rfleet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rfleet_postgres_data:
    name: rfleet_postgres_data
