<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="R-Fleet — Sistema de Gestão e Controle Operacional de Veículos na Oficina Mecânica e Funilaria" />
    <meta name="theme-color" content="#E2E5E3" />
    <title>R-Fleet — Controle de Veículos</title>
    <!-- Aplica o tema antes de pintar: escolha salva do usuário, senão o tema do sistema (ver src/utils/tema.ts) -->
    <script>
      (function () {
        var salvo = null;
        try { salvo = localStorage.getItem('rfleet_tema'); } catch (e) {}
        var escuro = salvo ? salvo === 'escuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
        document.querySelector('meta[name="theme-color"]').content = escuro ? '#171C20' : '#E2E5E3';
      })();
    </script>
    <!-- Google Fonts: Barlow (texto) e Barlow Semi Condensed (placas, etapas e números) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
