server:
  port: ${PORT:8081}
  servlet:
    context-path: /

spring:
  application:
    name: rfleet-backend
  config:
    # Lê o .env da raiz (rodando a partir de backend/) ou da pasta atual, se existir
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:rfleet}}
    username: ${SPRING_DATASOURCE_USERNAME:rfleet}
    password: ${SPRING_DATASOURCE_PASSWORD:rfleet123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  gestor:
    email: ${RFLEET_GESTOR_EMAIL:}
    senha: ${RFLEET_GESTOR_SENHA:}
    nome: ${RFLEET_GESTOR_NOME:Gestor}
    exigir-gestor-valido: true
